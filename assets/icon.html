<!doctype html>
<!-- Pictograma pluginului (1024×1024): listarea din directorul Claude și din cel ChatGPT/Codex.
     Cerută de Răzvan pe 23.10.2026: marca „romana” de pe banner, din care să se vadă ce face pluginul.
     Ideea: corectura însăși. Peste „romana” scris fără diacritice, un corector adaugă de mână „^” și căciula, iar cuvântul devine „română”;
     deasupra, tot de mână și ușor înclinat, notează „corectă” (cerut de Răzvan), în Caveat 700 (OFL).
     Variantele Recraft (litera „ă”, pagina corectată) și „română” cu bifă au fost respinse: nu spuneau ce face pluginul.
     Marca: Space Mono 700 (OFL), „roman” alb și ultimul „a” în albastrul primar #0055ff, ca pe banner.
     Semnele corectorului sunt verdele „corect” de pe banner, #4dff91; scriptul le așază peste literele 4 și 6, după metrica fontului.
     Fondul și grila vin de la banner: #050810, cu petele #0c1a4d și #1b0f45.
     Randare, din acest dosar:
       google-chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=5000 \
         --screenshot=icon.png --window-size=1024,1024 icon.html -->
<html lang="ro"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Space+Mono:wght@700&display=block">
<style>
html,body{margin:0;padding:0;background:#050810}
.b{position:relative;width:1024px;height:1024px;overflow:hidden;
  background:radial-gradient(ellipse 760px 640px at 30% 22%, #0c1a4d 0%, rgba(5,8,16,0) 72%),
             radial-gradient(ellipse 700px 560px at 100% 100%, #1b0f45 0%, rgba(5,8,16,0) 70%), #050810}
.g{position:absolute;inset:0;background-image:linear-gradient(rgba(0,85,255,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(0,85,255,.07) 2px,transparent 2px);
  background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 45%, #000 30%, transparent 100%)}
svg{position:absolute;inset:0}
.semn{fill:none;stroke:#4dff91;stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="b"><div class="g"></div>
<svg width="1024" height="1024" viewBox="0 0 1024 1024">
  <text id="marca" x="512" y="730" text-anchor="middle" font-family="Space Mono" font-weight="700" font-size="216" letter-spacing="-6" fill="#ffffff">roman<tspan fill="#0055ff">a</tspan></text>
  <text x="470" y="422" text-anchor="middle" font-family="Caveat" font-weight="700" font-size="190" fill="#4dff91" transform="rotate(-7 470 422)">corectă</text>
  <!-- „^” pentru â și căciula pentru ă, trase de mână; centrate pe 0,0 și mutate de script -->
  <path id="circumflex" class="semn" d="M-62 18 Q-34 -8 -4 -52 Q6 -58 12 -48 Q34 -12 60 20"/>
  <path id="breve" class="semn" d="M-58 -30 Q-46 22 2 22 Q48 22 60 -32"/>
</svg>
</div>
<script>
document.fonts.ready.then(() => {
  const t = document.getElementById('marca');
  const pune = (id, i) => {
    const r = t.getExtentOfChar(i);
    const x = r.x + r.width / 2, y = 730 - 216 * 0.56 - 44;
    document.getElementById(id).setAttribute('transform', `translate(${x} ${y})`);
  };
  pune('circumflex', 3);
  pune('breve', 5);
});
</script>
</body></html>
