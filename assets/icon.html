<!doctype html>
<!-- Pictograma pluginului (1024×1024): listarea din directorul Claude și din cel ChatGPT/Codex.
     Desenată de mână, în HTML și CSS: Recraft nu era configurat în sesiunea din 23.10.2026.
     Litera „ă” (Inter 800, OFL; „a” din Space Mono are un singur ochi și seamănă cu alfa) e albă, iar căciula e albastrul primar al doitmagic.ro, ca ultimul „a” din „romana” de pe banner.
     Fondul și grila vin de la banner: #050810, cu pata #0c1a4d.
     Randare, din acest dosar:
       google-chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=5000 \
         --screenshot=icon.png --window-size=1024,1024 icon.html -->
<html lang="ro"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=block">
<style>
html,body{margin:0;padding:0;background:#050810}
.b{position:relative;width:1024px;height:1024px;overflow:hidden;
  background:radial-gradient(ellipse 760px 640px at 30% 22%, #0c1a4d 0%, rgba(5,8,16,0) 72%),
             radial-gradient(ellipse 700px 560px at 100% 100%, #1b0f45 0%, rgba(5,8,16,0) 70%), #050810}
.g{position:absolute;inset:0;background-image:linear-gradient(rgba(0,85,255,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(0,85,255,.07) 2px,transparent 2px);
  background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 45%, #000 30%, transparent 100%)}
svg{position:absolute;inset:0}
</style></head><body>
<div class="b"><div class="g"></div>
<svg width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="sus"><rect x="0" y="0" width="1024" height="330"/></clipPath>
    <clipPath id="jos"><rect x="0" y="330" width="1024" height="694"/></clipPath>
  </defs>
  <text x="512" y="842" text-anchor="middle" font-family="Inter" font-weight="800" font-size="900" fill="#0055ff" clip-path="url(#sus)">ă</text>
  <text x="512" y="842" text-anchor="middle" font-family="Inter" font-weight="800" font-size="900" fill="#ffffff" clip-path="url(#jos)">ă</text>
</svg>
</div>
</body></html>
